<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市场 v6 · 固定五区模板</title>
<style>
:root{
  --ink-900:#14171F;--ink-700:#3A4250;--ink-600:#5B6372;--ink-400:#8A919E;--ink-300:#A1A7B2;--ink-200:#C9CED6;
  --bg-page:#F2F2F2;--bg-card:#FFF;--bg-subtle:#F7F8FA;--bg-muted:#F1F2F4;
  --line:#E3E6EB;--line-strong:#DDE1E7;
  --blue:#2457D6;--blue-deep:#1F3F8A;--blue-bg:#EAF0FD;
  --up:#B42318;--up-bg:#FDF0EF;--dn:#1E6B44;--dn-bg:#EDF7F1;--warn:#7A4A00;--warn-bg:#FFF1D6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html{font-variant-numeric:tabular-nums}
body{margin:0;background:var(--bg-page);font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;color:var(--ink-900);font-size:13px;line-height:1.55}
.num{font-family:var(--mono)}
.dn{color:var(--dn)}.up{color:var(--up)}
.top{display:flex;align-items:center;height:48px;background:#FAFAFA;border-bottom:1px solid var(--line);padding:0 20px;gap:12px;position:sticky;top:0;z-index:5}
.top b{font-size:15px}.top .sub{font-size:12px;color:var(--ink-400)}.top .sp{flex:1}
.mini{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--blue);font-size:12px;cursor:pointer}
#grid{max-width:1240px;margin:0 auto;padding:14px 20px 48px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:980px){#grid{grid-template-columns:1fr}}

/* ═══ 固定五区模板：每个格子完全相同的版式 ═══ */
.w{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.w.span2{grid-column:1/-1}
/* ① 头 */
.w-h{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px;border-bottom:1px solid var(--bg-muted);flex-wrap:wrap;flex:none}
.w-t{font-size:14px;font-weight:700}
.w-h .ops{margin-left:auto;display:flex;gap:10px}
.wlk{border:none;background:none;padding:0;font-size:12px;color:var(--blue);cursor:pointer;white-space:nowrap}
.wp{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700}
.wp.good{background:var(--up-bg);color:var(--up)}.wp.bad{background:var(--dn-bg);color:var(--dn)}
.wp.warn{background:var(--warn-bg);color:var(--warn)}.wp.flat{background:var(--bg-muted);color:var(--ink-700)}
.wa{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;background:var(--bg-muted);color:var(--ink-700);font-size:10px;font-weight:600}
/* ② 三关键数带：每格必有三数 */
.w-b{padding:12px 14px 10px;display:flex;flex-direction:column;min-width:0;flex:1}
.wms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wm{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.wm .k{font-size:10.5px;color:var(--ink-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm .v{font-size:15px;font-weight:700;margin-top:1px;font-family:var(--mono);white-space:nowrap}
.wm .s{font-size:10px;color:var(--ink-600);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ③ 一句话答案：每格必有 */
.wans{margin-top:10px;font-size:13px;line-height:1.65;color:var(--ink-700)}
.wans b{color:var(--ink-900)}
/* ④ 明细区：统一行/表 */
.wrows{margin-top:8px;display:flex;flex-direction:column}
.wr{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--bg-muted);align-items:baseline;font-size:12px;min-width:0}
.wr:first-child{border-top:none}
.wr .pre{flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-400);width:4.6em}
.wr .main{flex:none;font-weight:650;color:var(--ink-900)}
.wr .note{flex:1;min-width:0;color:var(--ink-600);line-height:1.5}
.wr .note b{color:var(--ink-900);font-weight:650}
.wr .right{flex:none;font-family:var(--mono);font-weight:650;margin-left:auto;white-space:nowrap}
.wtb{width:100%;border-collapse:collapse;margin-top:8px}
.wtb th{font-size:10px;font-weight:500;color:var(--ink-400);text-align:right;padding:2px 6px;border-bottom:1px solid var(--bg-muted);white-space:nowrap}
.wtb th:first-child{text-align:left}
.wtb td{padding:5px 6px;border-top:1px solid var(--bg-muted);text-align:right;font-size:12px;white-space:nowrap}
.wtb td:first-child{text-align:left;font-weight:650}
.wtb td.num{font-family:var(--mono);font-weight:600}
.wck2{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:6px}
.wck{display:flex;gap:6px;font-size:11.5px;align-items:baseline;padding:2px 0}
.wck .d{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink-200);margin-top:4px}
.wck.on .d{background:var(--ink-900)}
.wck .sh{font-weight:600;color:var(--ink-700)}.wck.on .sh{color:var(--ink-900)}
.wck .nw{color:var(--ink-400)}.wck.on .nw{color:var(--ink-600)}
.wgl{font-size:11px;font-weight:650;color:var(--ink-400);margin-top:6px}
/* ⑤ 脚 */
.w-f{padding:6px 14px;border-top:1px solid var(--bg-muted);font-size:11px;color:var(--ink-400);flex:none}
.w-f b{color:var(--ink-600);font-weight:600}
</style>
</head>
<body>
<div class="top">
  <b>市场</b><span class="sub">2026-11-20 盘后 · 每格同一版式：三关键数 → 一句话 → 明细</span>
  <span class="sp"></span><button class="mini">问大盘分析师</button><button class="mini">行情</button>
</div>
<div id="grid"></div>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═══ renderWidget：五区固定，数据只填槽位 ═══ */
function renderWidget(p){
  const b=[];
  b.push(`<section class="w${p.span2?' span2':''}">`);
  /* ① 头 */
  b.push(`<header class="w-h"><span class="w-t">${esc(p.title)}</span>`);
  (p.pills||[]).forEach(x=>b.push(`<span class="wp ${x.tone}">${esc(x.text)}</span>`));
  if(p.age)b.push(`<span class="wa">${esc(p.age)}</span>`);
  b.push(`<span class="ops">${(p.ops||[]).map(o=>`<button class="wlk">${esc(o)}</button>`).join('')}</span></header>`);
  b.push(`<div class="w-b">`);
  /* ② 三关键数（强制 3 个） */
  b.push(`<div class="wms">${p.metrics.slice(0,3).map(m=>
    `<div class="wm"><div class="k">${esc(m.k)}</div><div class="v ${m.dir||''}">${esc(m.v)}</div>${m.s?`<div class="s">${esc(m.s)}</div>`:''}</div>`).join('')}</div>`);
  /* ③ 一句话 */
  b.push(`<div class="wans">${p.answer}</div>`);
  /* ④ 明细（rows / groups / table / checks 任选，但样式统一） */
  if(p.table){
    b.push(`<table class="wtb"><thead><tr>${p.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`);
    p.table.rows.forEach(r=>b.push(`<tr>${r.map((c,i)=>`<td${i>0?' class="num"':''}>${c}</td>`).join('')}</tr>`));
    b.push(`</tbody></table>`);
  }
  (p.groups||[]).forEach(g=>{
    if(g.label)b.push(`<div class="wgl">${esc(g.label)}</div>`);
    b.push(`<div class="wrows">${rows(g.rows)}</div>`);
  });
  if(p.rows)b.push(`<div class="wrows">${rows(p.rows)}</div>`);
  if(p.checks)(p.checks).forEach(c=>{
    b.push(`<div class="wgl">${esc(c.label)}</div><div class="wck2">`);
    c.items.forEach(i=>b.push(`<div class="wck${i.on?' on':''}"><span class="d"></span><span class="sh">${esc(i.short)}</span><span class="nw">${esc(i.now)}</span></div>`));
    b.push(`</div>`);
  });
  b.push(`</div>`);
  /* ⑤ 脚 */
  if(p.foot)b.push(`<footer class="w-f"><b>口径</b>${esc(p.foot)}</footer>`);
  b.push(`</section>`);
  return b.join('');
}
function rows(rs){
  return rs.map(r=>{
    const q=[];
    if(r.pre)q.push(`<span class="pre">${esc(r.pre)}</span>`);
    if(r.main)q.push(`<span class="main">${esc(r.main)}</span>`);
    if(r.note)q.push(`<span class="note">${r.note}</span>`);
    if(r.right!=null)q.push(`<span class="right ${r.dir||''}">${esc(r.right)}</span>`);
    return `<div class="wr">${q.join('')}</div>`;
  }).join('');
}
